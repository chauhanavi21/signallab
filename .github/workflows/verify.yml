name: Verify portfolio

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-http:
    name: Core and HTTP (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run tests and regenerate evidence
        run: python signallab/verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-http-${{ matrix.os }}
          path: signallab/artifacts/verification.json

  browser:
    name: ${{ matrix.browser }} workflows (Python 3.13)
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install optional browser tools
        run: python -m pip install -r signallab/requirements-dev.txt
      - name: Install browser and system dependencies
        run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Exercise the real UI on an isolated server
        run: python signallab/browser_check.py --browser ${{ matrix.browser }}
      - name: Audit accessibility and mobile lab budgets
        if: matrix.browser == 'chromium'
        run: python signallab/quality_check.py
      - name: Build hash-verified browser demo
        run: python tools/build_pages.py
      - name: Exercise in-browser Python and tab isolation
        run: python tools/pages_check.py --browser ${{ matrix.browser }}
      - uses: actions/upload-pages-artifact@v3
        if: matrix.browser == 'chromium' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: _site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence-${{ matrix.browser }}
          path: |
            signallab/artifacts/browser-checks*.json
            signallab/artifacts/pages-*.json
            signallab/artifacts/quality-checks.json
            signallab/artifacts/browser/**/*.png

  source-package:
    name: Build verified source ZIP
    needs: [core-http, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/package.py
      - run: python tools/package.py --check
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-source
          path: |
            dist/*.zip
            dist/source-package.json

  deploy:
    name: Publish interactive Pages demo
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [core-http, browser, source-package]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@v4
